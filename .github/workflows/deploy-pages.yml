name: Deploy research portal to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate research portal
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f mattpocock-skills.html
          test -f davidondrej-skills.html
          test -f assets/mattpocock-skills.css
          test -f assets/mattpocock-skills.js
          test -f mattpocock-skills-study/README.md
          test -f aicomicbuilder.html
          test -f assets/aicomicbuilder.css
          test -f assets/aicomicbuilder.js
          test -f AIComicBuilder/REPORT.md
          test -f AIComicBuilder/docs/samples/sample-01-aicomicbuilder-pipeline.mp4
          test -f AIComicBuilder/docs/samples/sample-02-chatgpt-directed.mp4
          test -f livekit-agents.html
          test -f assets/livekit-agents.css
          test -f assets/livekit-agents.js
          test -f livekit-agents-study/local-app/product.html
          test -f livekit-agents-study/local-app/index.html
          node --check assets/mattpocock-skills.js
          node --check assets/aicomicbuilder.js
          node --check assets/livekit-agents.js
          node --check livekit-agents-study/local-app/product.js
          node --check livekit-agents-study/local-app/app.js
          grep -q 'ENGINEERING LINEAGE' mattpocock-skills.html
          grep -q '它不是导演' aicomicbuilder.html
          grep -q '运行与编排核心' livekit-agents.html
          grep -q 'mattpocock-skills.html' README.md
          grep -q 'mattpocock-skills-study/README.md' mattpocock-skills.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare static portal
        run: |
          mkdir -p _site
          cp ./*.html .nojekyll _site/
          cp -R assets _site/assets
          mkdir -p _site/AIComicBuilder/docs/samples
          cp AIComicBuilder/docs/samples/*.mp4 _site/AIComicBuilder/docs/samples/
          cp AIComicBuilder/docs/samples/*.jpg _site/AIComicBuilder/docs/samples/
          mkdir -p _site/horizon-study/demo-output
          cp horizon-study/demo-output/index.html _site/horizon-study/demo-output/index.html
          mkdir -p _site/livekit-agents-study/local-app
          cp livekit-agents-study/local-app/index.html _site/livekit-agents-study/local-app/
          cp livekit-agents-study/local-app/styles.css _site/livekit-agents-study/local-app/
          cp livekit-agents-study/local-app/app.js _site/livekit-agents-study/local-app/
          cp livekit-agents-study/local-app/product.html _site/livekit-agents-study/local-app/
          cp livekit-agents-study/local-app/product.css _site/livekit-agents-study/local-app/
          cp livekit-agents-study/local-app/product.js _site/livekit-agents-study/local-app/

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
